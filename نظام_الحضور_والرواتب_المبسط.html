    const STORAGE_KEY = 'attendance_simple_standalone_v2';

    const DEFAULT_PASS = '123456'; // كلمة المرور الافتراضية

    let state = {
      isAuthenticated: false,
      monthTitle: INITIAL_DATA.monthTitle || 'أغسطس 2026',
      employees: INITIAL_DATA.employees || [],

    // Check auth session
    try {
      if (sessionStorage.getItem(AUTH_KEY) === 'true' || localStorage.getItem(AUTH_KEY) === 'true') {
        state.isAuthenticated = true;
      }
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed.employees) state.employees = parsed.employees;
        if (parsed.attendance) state.attendance = parsed.attendance;
        if (parsed.advances) state.advances = parsed.advances;
      }
    } catch (e) {}

    function getStoredPassword() {
      return localStorage.getItem(PASS_KEY) || DEFAULT_PASS;
    }

    function checkPassword(inputPass, remember) {
      const correctPass = getStoredPassword();
      if (inputPass === correctPass) {
        state.isAuthenticated = true;
        state.loginError = false;
        if (remember) {
          localStorage.setItem(AUTH_KEY, 'true');
        } else {
          sessionStorage.setItem(AUTH_KEY, 'true');
        }
        render();
      } else {
        state.loginError = true;
        render();
      }
    }

    function logout() {
      state.isAuthenticated = false;
      sessionStorage.removeItem(AUTH_KEY);
      localStorage.removeItem(AUTH_KEY);
      render();
    }

    function changePassword() {
      const currentPass = getStoredPassword();
      const oldPass = prompt('أدخل كلمة المرور الحالية:');
      if (oldPass !== currentPass) {
        alert('كلمة المرور الحالية غير صحيحة!');
        return;
      }
      const newPass = prompt('أدخل كلمة المرور الجديدة:');
      if (newPass && newPass.trim().length >= 4) {
        localStorage.setItem(PASS_KEY, newPass.trim());
        alert('تم تغيير كلمة المرور بنجاح! كلمة مرورك الجديدة هي: ' + newPass.trim());
      } else {
        alert('كلمة المرور يجب أن تكون 4 أحرف/أرقام على الأقل.');
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          monthTitle: state.monthTitle,
          employees: state.employees,
          attendance: state.attendance,
          advances: state.advances
        }));
      } catch (e) {}
      render();
    }

    function parseShiftHours(shiftStr) {
      if (!shiftStr) return 0;
      const str = String(shiftStr).trim();
      if (str.includes('اجازه') || str.includes('إجازة') || str.includes('غياب') || str.includes('قبض')) return 0;
      const match = str.match(/(\d+)(?::(\d+))?\s*-\s*(\d+)(?::(\d+))?/);
      if (match) {
        const h1 = parseInt(match[1], 10);
        const m1 = match[2] ? parseInt(match[2], 10) : 0;
        const h2 = parseInt(match[3], 10);
        const m2 = match[4] ? parseInt(match[4], 10) : 0;
        let diff = (h2 <= h1) ? ((12 - h1 + h2) + (m2 - m1) / 60.0) : ((h2 - h1) + (m2 - m1) / 60.0);
        return Math.round(diff * 100) / 100;
      }
      const num = parseFloat(str);
      return !isNaN(num) ? num : 0;
    }

    function getSummary(emp) {
      const empAtt = state.attendance.filter(a => a.employeeId === emp.id);
      const empAdv = state.advances.filter(a => a.employeeId === emp.id);

      let presentDays = 0, holidayDays = 0, totalHours = 0;
      empAtt.forEach(a => {
        if (a.status === 'present') {
          presentDays++;
          totalHours += a.hours || parseShiftHours(a.shift);
        } else if (a.status === 'holiday') holidayDays++;
      });

      let totalAdv = 0, totalDed = 0;
      empAdv.forEach(a => {
        const amt = parseFloat(a.amount) || 0;
        if (a.type === 'advance') totalAdv += amt;
        else if (a.type === 'deduction') totalDed += amt;
      });

      const hourlyRate = emp.hourlyRate || 20;
      const earned = Math.round(totalHours * hourlyRate);
      const net = earned - (totalAdv + totalDed);

      return { presentDays, holidayDays, totalHours: Math.round(totalHours*10)/10, totalAdv, totalDed, earned, net };
    }

    function exportExcel() {
      const wb = XLSX.utils.book_new();
      const dateSet = new Set();
      state.attendance.forEach(a => a.date && dateSet.add(a.date));
      state.advances.forEach(a => a.date && dateSet.add(a.date));
      const sortedDates = Array.from(dateSet).sort();

      const h1 = ['التاريخ', 'اليوم'];
      const h2 = ['', ''];
      state.employees.forEach(emp => {
        h1.push(emp.name, '');
        h2.push('حضور', 'سلف');
      });

      const rows = [h1, h2];
      sortedDates.forEach(dStr => {
        const dObj = new Date(dStr);
        const dayName = isNaN(dObj.getTime()) ? '' : dObj.toLocaleDateString('ar-EG', { weekday: 'long' });
        const row = [dStr, dayName];
        state.employees.forEach(emp => {
          const att = state.attendance.find(a => a.employeeId === emp.id && a.date === dStr);
          const advs = state.advances.filter(a => a.employeeId === emp.id && a.date === dStr);
          const shiftVal = att ? (att.status === 'holiday' ? 'اجازه' : att.shift || '') : '';
          const advVal = advs.map(a => a.amount).join('+');
          row.push(shiftVal, advVal);
        });
        rows.push(row);
      });

      const ws = XLSX.utils.aoa_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb, ws, 'شيت الحضور');
      XLSX.writeFile(wb, `شيت_الحضور_${state.monthTitle}.xlsx`);
    }

            <td class="py-2.5 px-3 text-center font-bold text-rose-600">${s.totalAdv > 0 ? '-' + s.totalAdv + ' ج.م' : '-'}</td>
            <td class="py-2.5 px-3 text-center font-black text-indigo-950 bg-indigo-50/50 text-sm">${s.net} ج.م</td>
            <td class="py-2.5 px-3 text-center text-slate-400 font-mono text-[10px]">...................</td>
          </tr>
        `;
      });

      app.innerHTML = `
        <!-- Header -->
        <header class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200/80 flex flex-col md:flex-row md:items-center justify-between gap-4 no-print">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-black text-lg shadow-md shadow-indigo-600/30">✓</div>
            <div>
              <h1 class="text-xl font-black text-slate-900">نظام إدارة الحضور والرواتب</h1>
              <p class="text-xs text-slate-500">شهر: ${state.monthTitle} • <span class="text-emerald-600 font-bold">محمي وحفظ تلقائي مفعل</span></p>
            </div>
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <button onclick="exportExcel()" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-sm">تصدير Excel</button>
            <button onclick="window.print()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold shadow-sm">طباعة الكشف</button>
            <button onclick="changePassword()" class="px-3 py-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-bold border border-amber-200" title="تغيير كلمة المرور">🔑 تغيير الرمز</button>
            <button onclick="logout()" class="px-3 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold border border-rose-200" title="قفل / تسجيل الخروج">🔒 قفل</button>
          </div>
        </header>

        <!-- Employee Badges -->
        <section class="no-print">
          <div class="flex justify-between items-center mb-2.5">
            <h2 class="text-xs font-bold text-slate-700">ملخص سريع للموظفين (اضغط للتصفية):</h2>
            ${state.selectedEmpFilter !== 'all' ? '<button onclick="state.selectedEmpFilter=\'all\'; render();" class="text-xs font-bold text-indigo-600">عرض الكل</button>' : ''}
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2.5">${cardsHtml}</div>
        </section>

        <!-- Quick Add Bar -->
        <section class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-sm no-print">
          <form onsubmit="handleQuickSubmit(event)" class="flex flex-wrap items-center gap-2.5 text-xs">
            <span class="font-bold text-slate-800">تسجيل سريع:</span>
            <select id="qEmp" class="px-3 py-1.5 rounded-xl border border-slate-300 font-bold bg-slate-50">
              ${state.employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('')}
            </select>
            <input id="qDate" type="date" value="2026-09-01" class="px-3 py-1.5 rounded-xl border border-slate-300 font-bold" />
            <select id="qType" onchange="document.getElementById('qAmt').style.display = (this.value === 'advance' ? 'inline-block' : 'none')" class="px-3 py-1.5 rounded-xl border border-slate-300 font-bold bg-slate-50">
              <option value="5:00-2:00">وردية مسائية (5:00-2:00)</option>
              <option value="9:00-5:00">وردية صباحية (9:00-5:00)</option>
              <option value="اجازه">إجازة</option>
              <option value="advance">سلفة نقدية</option>
            </select>
            <input id="qAmt" type="number" placeholder="المبلغ" style="display:none;" class="w-24 px-2 py-1.5 rounded-xl border border-amber-300 bg-amber-50 font-bold text-center" />
            <button type="submit" class="px-4 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold mr-auto">حفظ</button>
          </form>
        </section>

        <!-- Main Matrix Table -->
        <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
          <div class="p-3.5 border-b border-slate-200/80 flex justify-between items-center bg-slate-50/60 no-print">
            <h2 class="text-xs font-bold text-slate-900">جدول الحضور والسلف المباشر (انقر على أي خلية للتعديل)</h2>
            <input type="text" placeholder="بحث بالتاريخ..." oninput="state.searchTerm = this.value; render();" value="${state.searchTerm}" class="px-3 py-1 rounded-xl border border-slate-200 text-xs w-40 bg-white" />
          </div>
          <div class="overflow-x-auto max-h-[58vh]">
            <table class="w-full text-right text-xs border-collapse">
              <thead class="bg-slate-900 text-white sticky top-0 z-20 select-none">
                <tr>
                  <th class="py-2.5 px-3 border-l border-slate-700 text-center min-w-[90px] bg-slate-950 font-bold">التاريخ</th>
                  <th class="py-2.5 px-2 border-l border-slate-700 text-center min-w-[75px] bg-slate-950 font-bold">اليوم</th>
                  ${visibleEmployees.map(emp => `<th colspan="2" class="py-2 px-2 border-l border-slate-700 text-center font-bold" style="border-top: 3px solid ${emp.color || '#6366F1'}">${emp.name}</th>`).join('')}
                </tr>
                <tr class="bg-slate-800 text-slate-300 text-[11px]">
                  <th class="py-1 px-2 border-l border-slate-700 text-center bg-slate-900">-</th>
                  <th class="py-1 px-2 border-l border-slate-700 text-center bg-slate-900">-</th>
                  ${visibleEmployees.map(emp => `<th class="py-1 px-2 border-l border-slate-700 text-center text-emerald-300 min-w-[90px]">حضور</th><th class="py-1 px-2 border-l border-slate-700 text-center text-amber-300 min-w-[80px]">سلف</th>`).join('')}}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">${tableRows}</tbody>
              <tfoot class="bg-slate-900 text-white sticky bottom-0 z-10 font-bold border-t-2 border-indigo-500 text-xs">
                <tr>
                  <td colspan="2" class="py-2 px-3 text-center bg-slate-950 border-l border-slate-700">الإجمالي</td>
                  ${footCols}
                </tr>
              </tfoot>
            </table>
          </div>
        </section>

        <!-- Final Payroll Table -->
        <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-5 space-y-4 print:p-0 print:border-none">
          <div class="flex justify-between items-center border-b pb-3 border-slate-200">
            <div>
              <h2 class="text-base font-bold text-slate-900">كشف الرواتب والمستحقات النهائية لشهر ${state.monthTitle}</h2>
              <p class="text-xs text-slate-500">صافي الرواتب المستحقة للصرف بعد خصم السلف</p>
            </div>
            <button onclick="window.print()" class="px-4 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold no-print">طباعة هذا الكشف</button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-right text-xs border border-slate-200 rounded-xl overflow-hidden">
              <thead class="bg-slate-900 text-white font-bold">
                <tr>
                  <th class="py-2.5 px-3">#</th>
                  <th class="py-2.5 px-3">الموظف</th>
                  <th class="py-2.5 px-3 text-center">أيام الحضور</th>
                  <th class="py-2.5 px-3 text-center">إجمالي الساعات</th>
                  <th class="py-2.5 px-3 text-center">المستحق</th>
                  <th class="py-2.5 px-3 text-center text-amber-300">السلف والخصم</th>
                  <th class="py-2.5 px-3 text-center text-emerald-300 font-black">صافي المستحق</th>
                  <th class="py-2.5 px-3 text-center">التوقيع</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">${payrollRows}</tbody>
            </table>
          </div>
        </section>
      `;
    }

    function editCell(empId, date, type, currentVal) {
      const promptText = type === 'shift' ? 'أدخل الوردية (مثال: 5:00-2:00 أو اجازه):' : 'أدخل مبلغ السلفة (أو اتركه فارغاً للإلغاء):';
      const newVal = prompt(promptText, currentVal || '');
      if (newVal === null) return;

      if (type === 'shift') {
        let status = 'present', hours = 0;
        const val = newVal.trim();
        if (val.includes('اجازه') || val.includes('إجازة')) status = 'holiday';
        else if (val.includes('غياب')) status = 'absent';
        else if (val) { status = 'present'; hours = parseShiftHours(val); }
        else status = 'none';

        const idx = state.attendance.findIndex(a => a.employeeId === empId && a.date === date);
        if (idx >= 0) {
          state.attendance[idx] = { ...state.attendance[idx], shift: val, status, hours };
        } else {
          state.attendance.push({ id: 'att_' + Date.now(), employeeId: empId, date, shift: val, status, hours });
        }
      } else {
        const raw = newVal.trim();
        state.advances = state.advances.filter(a => !(a.employeeId === empId && a.date === date));
        const numM = raw.match(/(\d+)/);
        if (numM) {
          state.advances.push({
            id: 'adv_' + Date.now(),
            employeeId: empId,
            date,
            amount: parseFloat(numM[1]),
            type: 'advance',
            notes: 'مسجل (' + raw + ')'
          });
        }
      }
      saveState();
    }

    function handleQuickSubmit(e) {
      e.preventDefault();
      const empId = document.getElementById('qEmp').value;
      const date = document.getElementById('qDate').value;
      const type = document.getElementById('qType').value;
      const amt = document.getElementById('qAmt').value;

      if (type === 'advance') {
        if (amt) {
          state.advances = state.advances.filter(a => !(a.employeeId === empId && a.date === date));
          state.advances.push({
            id: 'adv_' + Date.now(),
            employeeId: empId,
            date,
            amount: parseFloat(amt),
            type: 'advance',
            notes: 'سلفة'
          });
        }
      } else {
        let status = 'present', hours = 0;
        if (type === 'اجازه') status = 'holiday';
        else { status = 'present'; hours = parseShiftHours(type); }

        const idx = state.attendance.findIndex(a => a.employeeId === empId && a.date === date);
        if (idx >= 0) {
          state.attendance[idx] = { ...state.attendance[idx], shift: type, status, hours };
        } else {
          state.attendance.push({ id: 'att_' + Date.now(), employeeId: empId, date, shift: type, status, hours });
        }
      }
      saveState();
    }

    render();
  </script>
</body>
</html>
